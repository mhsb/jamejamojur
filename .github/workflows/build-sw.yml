# هر بار که فایلی در گیت‌هاب تغییر کند، sw.js (فهرست فایل‌های آفلاین) را خودکار به‌روز می‌کند
name: update-offline-list
on:
  push:
    branches: [main]
    paths-ignore: [sw.js]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_sw.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sw.js
          git diff --cached --quiet || (git commit -m "update offline list" && git push)
