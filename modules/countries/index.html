<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کارت کشورها</title>
<style>@font-face{font-family:V;src:url(../../assets/fonts/vazirmatn-subset.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:V,Tahoma,'Segoe UI',sans-serif;color:#1d3557;background:#f4efe6}
header{position:sticky;top:0;z-index:5;background:#fffdf8f2;box-shadow:0 2px 10px #0002;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
h1{font-size:20px;margin:0;font-weight:800;color:#d9502b}button,input,select{font:inherit;color:inherit}
.chip{border:1.5px solid #1d355733;background:#fff;border-radius:99px;padding:3px 12px;cursor:pointer;font-size:13px;text-decoration:none;color:inherit;white-space:nowrap}.chip.on{background:#1d3557;color:#fff}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
#q{border:1.5px solid #1d355755;border-radius:99px;padding:5px 14px;width:200px;font-size:14px;flex:1;min-width:130px;max-width:300px}
select{border:1.5px solid #1d355755;border-radius:99px;padding:4px 10px;background:#fff;font-size:13px}
#ch{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px}#cnt{font-size:13px;opacity:.7}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px;max-width:1500px;margin:auto}
.cd{background:#fffdf8;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0002;border-top:6px solid var(--c);cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:2px}
.cd:hover{transform:translateY(-3px);box-shadow:0 8px 20px #0003}
.fl{height:84px;margin-bottom:8px;display:flex;justify-content:center}.fl img{height:100%;border-radius:6px;box-shadow:0 0 0 1px #0003;background:#eee}.fl span{font-size:50px}
.cd h3{margin:0;font-size:19px;font-weight:800;text-align:center}.cd small{text-align:center;opacity:.6;margin-bottom:6px}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed #1d355726}.ln b{font-weight:600}
.tag{align-self:center;margin-top:8px;font-style:normal;font-size:12px;background:var(--c);padding:1px 10px;border-radius:99px}
#mo{position:fixed;inset:0;background:#0007;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}#mo.on{display:flex}
#box{background:#fffdf8;border-radius:20px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto;position:relative}
#box .fl{height:110px}#box h2{margin:0;text-align:center;font-size:26px;font-weight:800}#box h4{margin:12px 0 2px;color:#d9502b;font-size:14px;border-bottom:2px solid #d9502b33}
.x{position:absolute;top:10px;left:12px;border:0;background:#0001;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:15px}
.big{display:block;text-align:center;text-decoration:none;margin-top:10px;background:#d9502b;color:#fff;border-radius:10px;padding:9px;font-weight:600}.big.g{background:#0b7a4b}
@media(max-width:760px){header{padding:6px 10px}h1{font-size:17px}#grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}.cd{padding:10px}.fl{height:62px}.cd h3{font-size:16px}.ln{font-size:12px}}
</style></head><body>
<header><h1>🃏 کارت کشورها</h1><a class="chip" href="#" data-go="atlas">🌍 اطلس جهان</a><input id="q" placeholder="جستجوی کشور یا پایتخت…"><select id="so"><option value="n">مرتب‌سازی: نام</option><option value="p">بیشترین جمعیت</option><option value="a">بیشترین مساحت</option></select>
<button class="chip" id="lv">حالت: ساده</button><button class="chip" id="rn">🎲 شانسی</button><span id="cnt"></span><div id="ch"></div></header>
<main id="grid"></main><div id="mo"><div id="box"></div></div>
<script src="data.js"></script><script src="../../assets/js/bridge.js"></script><script src="app.js"></script></body></html>
