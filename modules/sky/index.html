<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>گنبد آسمان</title>
<style>@font-face{font-family:'Vazirmatn';src:url(../../assets/fonts/vazirmatn-subset.woff2) format('woff2');font-weight:100 900;font-display:swap}</style>
<style>
:root{--ac:#ffb938;--bh:calc(106px + env(safe-area-inset-bottom,0px));--gl:rgba(10,20,32,.62);--ln:rgba(255,255,255,.22);--mu:#b4c4d0}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#000;overscroll-behavior:none}
body{color:#fff;font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;line-height:1.6}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
button,select{font:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid var(--ln);border-radius:10px;padding:5px 12px;cursor:pointer;max-width:100%;color-scheme:dark}
button:focus-visible,select:focus-visible,#pad:focus-visible,canvas:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.gl{background:var(--gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--ln)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
.top>*{pointer-events:auto}
.top .gl{border-radius:22px;padding:5px 14px;color:#fff}
.chip{font-weight:600;font-size:.9rem;max-width:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-family:inherit}
.drop{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);inset-inline:10px;max-width:400px;border-radius:16px;padding:12px;display:grid;gap:8px;opacity:0;visibility:hidden;transform:translateY(-14px);transition:transform .25s,opacity .25s,visibility .25s}
.drop.open{opacity:1;visibility:visible;transform:none}
.g2{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.g2 label{color:var(--mu);font-size:.85rem}
.r{display:flex;flex-wrap:wrap;gap:8px}
.sm{color:var(--mu);font-size:.8rem}
#dg{margin:0;white-space:pre-wrap;font:inherit;font-size:.8rem;background:rgba(0,0,0,.35);border-radius:8px;padding:8px}
.bar{position:fixed;bottom:0;inset-inline:0;margin-inline:auto;max-width:560px;display:flex;align-items:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;border-bottom:0}
#pad{width:88px;height:88px;flex:none;border-radius:50%;position:relative;touch-action:none;cursor:pointer;border:1.5px solid rgba(255,255,255,.4);
background:linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) center/1px 72% no-repeat,linear-gradient(rgba(255,255,255,.22),rgba(255,255,255,.22)) center/72% 1px no-repeat,rgba(255,255,255,.08)}
#pad i{position:absolute;font-style:normal;font-size:9px;opacity:.7;line-height:1}
#kn{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .18s}
#kn.drag{transition:none}
#inf{flex:1;min-width:0;font-size:.8rem;line-height:1.5}
#inf div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col{display:flex;flex-direction:column;gap:6px;flex:none}
.col button{padding:5px 10px;font-size:.85rem}
button.on,button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#1b1200;font-weight:600}
.fl{position:fixed;inset-inline-end:10px;bottom:calc(var(--bh) + 10px);display:flex;flex-direction:column;gap:10px}
.fl button{width:46px;height:46px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.fl button[aria-pressed=true]{background:var(--ac)}
#toast{position:fixed;bottom:calc(var(--bh) + 10px);inset-inline:10px;margin-inline:auto;width:fit-content;max-width:calc(100% - 80px);border-radius:14px;padding:8px 12px;font-size:.85rem;display:grid;gap:6px;justify-items:start;margin-inline-end:70px}
#hint{position:fixed;bottom:calc(var(--bh) + 14px);inset-inline:0;text-align:center;font-size:.9rem;padding:0 70px 0 16px;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity 1s}
@media (prefers-reduced-motion:reduce){.drop,#hint,#kn{transition:none}}
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="گنبد آسمان؛ با کشیدن انگشت جهت دید را عوض کنید"></canvas>
<div class="top"><button id="mb" class="gl" aria-expanded="false" aria-controls="menu">☰ منو</button><button id="chip" class="gl chip" aria-label="باز کردن منو"></button></div>
<div id="menu" class="drop gl" role="dialog" aria-label="تنظیمات">
 <div class="g2"><label for="co">کشور</label><select id="co"></select><label for="ci">شهر</label><select id="ci"></select><label for="wx">هوا</label>
 <select id="wx"><option value="auto">خودکار (فصلی)</option><option value="clear">آفتابی</option><option value="wind">باد</option><option value="rain">باران</option><option value="snow">برف</option></select></div>
 <div class="sm" id="loc"></div>
 <div class="r"><button id="fl">تمام‌صفحه</button><button id="ts">تست حسگر</button></div>
 <div class="r"><button id="gs">🪐 زمین در منظومه</button><button id="gm">🗺️ روی نقشه</button></div>
 <pre id="dg" hidden></pre>
</div>
<div id="hint">بکشید تا بچرخید · دایره‌ی پایین: افقی = ساعت، عمودی = روز</div>
<div id="toast" class="gl" role="status" hidden><span id="nt"></span><button id="ot" hidden>باز کردن در تب مستقل</button></div>
<div class="fl">
 <button id="fw" class="gl" aria-pressed="false" aria-label="دنبال کردن خورشید"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg></button>
 <button id="gy" class="gl" aria-pressed="false" aria-label="جهت‌نمای گوشی"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></button>
</div>
<div class="bar gl">
 <div id="pad" tabindex="0" role="application" aria-label="کنترل زمان: افقی ساعت، عمودی روز"><i style="top:5px;left:50%;margin-left:-4px">▲</i><i style="bottom:5px;left:50%;margin-left:-4px">▼</i><i style="left:6px;top:50%;margin-top:-4px">◀</i><i style="right:6px;top:50%;margin-top:-4px">▶</i><span id="kn"></span></div>
 <div id="inf" aria-live="off"></div>
 <div class="col"><button id="pl" aria-label="پخش خودکار زمان">▶</button><button id="nw">اکنون</button></div>
</div>
<script src="../../assets/js/bridge.js"></script><script src="app.js"></script>
</body>
</html>
