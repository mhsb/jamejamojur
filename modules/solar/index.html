<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>@font-face{font-family:Vazirmatn;src:url(../../assets/fonts/vazirmatn-subset.woff2) format("woff2");font-weight:100 900;font-display:swap}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومهٔ شمسی سه‌بعدی</title>
<style>
:root{color-scheme:dark;--bg:#060919;--panel:rgba(12,17,42,.84);--line:rgba(160,185,255,.22);--text:#eaf0ff;--dim:#9fb0d8;--sun:#ffb347;--sky:#5ec2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.lbl{position:fixed;left:0;top:0;font-size:12px;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none;white-space:nowrap}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 70px)}
#hud h1{margin:0;font-size:18px}
#info{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;max-width:400px;line-height:1.8;font-size:13px}
#info b{color:var(--sun)}
#info .why{color:var(--dim);font-size:12px;line-height:1.7;margin-top:2px}
#tg{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);padding:6px 10px}
#bar{position:fixed;right:0;left:0;bottom:0;max-height:50vh;overflow-y:auto;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:linear-gradient(transparent,rgba(6,9,25,.92) 22%)}
#chips{display:flex;gap:6px;overflow-x:auto;width:100%;padding:18px 2px 2px;scrollbar-width:none}
#chips button{flex:none}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 8px}
.grp>span{font-size:12px;color:var(--dim)}
.sl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--dim);min-width:150px;flex:1}
.sl b{color:var(--text)}
input[type=range]{width:100%;accent-color:var(--sky);margin:4px 0}
button{font:inherit;font-size:13px;color:var(--text);background:rgba(94,194,255,.12);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:36px;cursor:pointer}
button:hover{background:rgba(94,194,255,.25)}
button[aria-pressed="true"],button.on{background:var(--sky);color:#04122a;border-color:var(--sky);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#top{display:flex;gap:6px;align-items:center;width:100%}#top #chips{width:auto;flex:1;min-width:0}#mt{display:none;flex:none;margin-top:16px}#more{display:contents}
@media(max-width:700px){#mt{display:block}#bar:not(.open) #more{display:none}#bar{max-height:42vh}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
  <h1>منظومهٔ شمسی</h1>
  <div id="info">
    <div>تاریخ: <b id="date"></b> · ساعت <b id="clock"></b> (<span id="pn">ایران</span>)</div>
    <div>نیم‌کرهٔ شمالی: <b id="sN"></b> · جنوبی: <b id="sS"></b></div>
    <div><span id="pn2">ایران</span> الان: <b id="dn"></b></div>
    <div class="why" id="why"></div>
  </div>
</div>
<button id="tg" aria-pressed="true">کنترل‌ها</button>
<div id="bar">
  <div id="top"><button id="mt">⚙️ کنترل‌ها ▴</button><div id="chips"></div></div>
  <div id="more">
  <div class="grp" style="flex:1 1 100%">
    <label class="sl">ساعت روز <b id="hl"></b><input id="hr" dir="ltr" type="range" min="0" max="24" step="0.05"></label>
    <label class="sl">روز سال (از اول فروردین) <b id="dl"></b><input id="dy" dir="ltr" type="range" min="0" max="364" step="1"></label>
  </div>
  <div class="grp"><span>سرعت</span><button id="s0">روز</button><button id="s1">ماه</button><button id="s2">سال</button><button id="sp" aria-pressed="false">توقف</button><button id="rev" aria-pressed="false">برعکس</button></div>
  <div class="grp"><span>برو به</span><button data-q="0">بهار</button><button data-q="1">تابستان</button><button data-q="2">پاییز</button><button data-q="3">زمستان</button></div>
  <div class="grp"><button id="vSide">از کنار</button><button id="tAxis" aria-pressed="false">محور زمین</button><button id="tOrb" aria-pressed="true">مدارها</button><button id="tIran" aria-pressed="false">نشانگر مکان</button></div>
  <div class="grp"><button id="toSky">🌅 آسمان از این نقطه</button><button id="toMap">🗺️ روی نقشه</button></div>
  </div>
</div>
<script src="../../assets/lib/three.min.js"></script>
<script src="../../assets/js/bridge.js"></script><script src="app.js"></script>
</body>
</html>
